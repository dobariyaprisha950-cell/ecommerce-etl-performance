[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-etl-performance"
version = "1.0.0"
description = "Streaming and vectorized e-commerce ETL performance study"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "py-spy>=0.4"]
polars = ["polars>=1.0"]

[project.scripts]
pipeline = "etl_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["etl_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["etl_pipeline"]
